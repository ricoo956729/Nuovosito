          customizeButtonCaptionColor: "#082A4A",
        },
        callback: {
          // iubenda non emette eventi DOM: li rilanciamo noi così che i componenti
          // React possano reagire al consenso (vedi useConsensoIubenda in src/lib/iubenda.ts).
          onPreferenceExpressedOrNotNeeded: function () {
            window.dispatchEvent(new CustomEvent("iubenda:consenso"));
          },
          onPreferenceExpressed: function () {
            window.dispatchEvent(new CustomEvent("iubenda:consenso"));
          },
        },
      };
    </script>
